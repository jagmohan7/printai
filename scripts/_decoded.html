<style>/* ============================================================
   PrintAI · Wireframe Exploration — mid-fi kit
   Grey-box primitives + brand-aware tokens + annotation layer.
   Theme is driven by [data-theme] on <html>.
   ============================================================ */

:root {
  /* brand */
  --pa-navy-deep: #0B1628;
  --pa-navy: #1A3C5E;
  --pa-teal: #13C07A;
  --pa-teal-deep: #0F6E56;
  --pa-grey: #F5F6F8;

  /* shape */
  --wf-radius: 16px;
  --wf-radius-sm: 10px;
  --wf-radius-lg: 22px;
  --wf-pill: 999px;

  /* LIGHT theme surfaces */
  --wf-page: #FFFFFF;
  --wf-page-2: #F5F6F8;
  --wf-navy: #0B1628;
  --wf-ink: #0B1628;
  --wf-ink-2: #5A6675;
  --wf-box: #E8EBEF;
  --wf-box-2: #DCE0E6;
  --wf-bar: #CBD1DA;
  --wf-bar-2: #AEB6C1;
  --wf-line: #E3E7EC;
  --wf-card: #FFFFFF;
  --wf-shadow: 0 1px 2px rgba(11,22,40,.05), 0 10px 30px rgba(11,22,40,.07);
  --wf-shadow-sm: 0 1px 2px rgba(11,22,40,.05), 0 4px 14px rgba(11,22,40,.06);

  /* teal usage */
  --wf-teal: #13C07A;
  --wf-teal-deep: #0F6E56;
  --wf-teal-soft: rgba(19,192,122,.12);
  --wf-on-teal: #062A1E;

  /* annotation ("designer's pen") layer */
  --wf-anno-bg: #F6F8FA;
  --wf-anno-line: #C7D1DD;
  --wf-anno-ink: #5C6B7E;
  --wf-anno-strong: #2C5D87;
  --wf-anno-soft: rgba(44,93,135,.10);
}

:root[data-theme="dark"] {
  --wf-page: #0B1628;
  --wf-page-2: #0F1F38;
  --wf-navy: #060F1C;
  --wf-ink: #E9EEF4;
  --wf-ink-2: #93A2B6;
  --wf-box: rgba(255,255,255,.07);
  --wf-box-2: rgba(255,255,255,.12);
  --wf-bar: rgba(255,255,255,.17);
  --wf-bar-2: rgba(255,255,255,.32);
  --wf-line: rgba(255,255,255,.12);
  --wf-card: #13243E;
  --wf-shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 34px rgba(0,0,0,.4);
  --wf-shadow-sm: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.36);
  --wf-teal-soft: rgba(19,192,122,.18);
  --wf-on-teal: #04231A;

  --wf-anno-bg: rgba(255,255,255,.035);
  --wf-anno-line: rgba(255,255,255,.14);
  --wf-anno-ink: #93A4B8;
  --wf-anno-strong: #7DBBED;
  --wf-anno-soft: rgba(125,187,237,.14);
}

/* ---- context modifiers: a section painted on navy or grey ---- */
.on-navy {
  --wf-ink: #EAF1F8;
  --wf-ink-2: #9FB3C8;
  --wf-box: rgba(255,255,255,.09);
  --wf-box-2: rgba(255,255,255,.15);
  --wf-bar: rgba(255,255,255,.22);
  --wf-bar-2: rgba(255,255,255,.42);
  --wf-line: rgba(255,255,255,.14);
  --wf-card: rgba(255,255,255,.06);
  --wf-shadow: 0 1px 2px rgba(0,0,0,.3), 0 14px 34px rgba(0,0,0,.3);
  background: var(--wf-navy);
  color: var(--wf-ink);
}
.on-grey { background: var(--wf-page-2); }

/* ============================================================
   Artboard shell + annotation footer
   ============================================================ */
.wf-art {
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--wf-page);
  color: var(--wf-ink);
  font-family: 'Inter', system-ui, sans-serif;
  overflow: hidden;
  position: relative;
}
.wf-art, .wf-art * { box-sizing: border-box; }
.wf-stage {
  flex: 1 1 auto;
  position: relative;
  overflow: hidden;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
/* the single child of a stage fills it, so inner height:100% resolves
   against a definite box and Pad padding stays inside (border-box) */
.wf-stage > * { flex: 1 1 auto; min-height: 0; }
.wf-anno {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 26px;
  background: var(--wf-anno-bg);
  border-top: 1px dashed var(--wf-anno-line);
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
}
.wf-anno-title {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--wf-anno-strong);
  letter-spacing: .2px;
}
.wf-anno-title::before {
  content: "";
  width: 9px; height: 9px;
  border-radius: 2px;
  background: var(--wf-anno-strong);
  transform: rotate(45deg);
}
.wf-anno-notes {
  flex: 1 1 auto;
  font-size: 12px;
  line-height: 1.45;
  color: var(--wf-anno-ink);
}
.wf-anno-tags { flex: 0 0 auto; display: flex; gap: 6px; }
.wf-tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  padding: 3px 9px;
  border: 1px solid var(--wf-anno-line);
  border-radius: var(--wf-pill);
  color: var(--wf-anno-ink);
  white-space: nowrap;
}

/* numbered callout pin */
.wf-pin {
  position: absolute;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--wf-anno-strong);
  color: #fff;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
  z-index: 5;
}

/* ============================================================
   Grey-box primitives
   ============================================================ */
.wf-bar { display: block; height: 12px; border-radius: 5px; background: var(--wf-bar); }
.wf-bar.s { background: var(--wf-bar-2); }
.wf-box { background: var(--wf-box); border-radius: var(--wf-radius-sm); }
.wf-card {
  background: var(--wf-card);
  border: 1px solid var(--wf-line);
  border-radius: var(--wf-radius);
  box-shadow: var(--wf-shadow-sm);
}
.wf-img {
  background-color: var(--wf-box);
  background-image: repeating-linear-gradient(135deg,
     transparent 0 11px, var(--wf-box-2) 11px 12px);
  border: 1px dashed var(--wf-line);
  border-radius: var(--wf-radius-sm);
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  color: var(--wf-ink-2);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: .3px;
  padding: 10px;
  position: relative;
}
.wf-avatar {
  border-radius: 50%;
  background-color: var(--wf-box);
  background-image: repeating-linear-gradient(135deg,
     transparent 0 7px, var(--wf-box-2) 7px 8px);
  border: 1px dashed var(--wf-line);
  flex: 0 0 auto;
}
.wf-icon {
  border-radius: var(--wf-radius-sm);
  background: var(--wf-teal-soft);
  border: 1px solid var(--wf-line);
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 auto;
}
.wf-icon::after {
  content: "";
  width: 42%; height: 42%;
  border-radius: 4px;
  background: var(--wf-teal);
  opacity: .65;
}

/* buttons */
.wf-btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px;
  height: 46px; padding: 0 22px;
  border-radius: var(--wf-radius-sm);
  font-family: 'Inter', sans-serif;
  font-size: 14px; font-weight: 600;
  white-space: nowrap;
}
.wf-btn.pri { background: var(--wf-teal); color: var(--wf-on-teal); }
.wf-btn.deep { background: var(--wf-teal-deep); color: #fff; }
.wf-btn.ghost { background: transparent; border: 1px solid var(--wf-line); color: var(--wf-ink); }
.wf-btn.sm { height: 38px; padding: 0 16px; font-size: 13px; }
.wf-btn.lg { height: 54px; padding: 0 28px; font-size: 15px; }

/* chips / pills */
.wf-chip {
  display: inline-flex; align-items: center; gap: 7px;
  height: 30px; padding: 0 13px;
  border-radius: var(--wf-pill);
  border: 1px solid var(--wf-line);
  background: var(--wf-card);
  font-size: 12.5px; font-weight: 500; color: var(--wf-ink-2);
  white-space: nowrap;
}
.wf-chip.teal { background: var(--wf-teal-soft); border-color: transparent; color: var(--wf-teal-deep); }
:root[data-theme="dark"] .wf-chip.teal { color: var(--wf-teal); }

/* real text helpers */
.wf-h {
  font-family: 'Inter', sans-serif;
  color: var(--wf-ink);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.04;
  margin: 0;
  text-wrap: balance;
}
.wf-sub {
  font-family: 'Inter', sans-serif;
  color: var(--wf-ink-2);
  font-weight: 400;
  line-height: 1.5;
  margin: 0;
  text-wrap: pretty;
}
.wf-eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--wf-teal-deep);
}
:root[data-theme="dark"] .wf-eyebrow { color: var(--wf-teal); }
.teal { color: var(--wf-teal); }

/* logo */
.wf-logo { display: inline-flex; align-items: center; gap: 11px; }
.wf-logo-mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(150deg, var(--wf-teal), var(--wf-teal-deep));
  position: relative; flex: 0 0 auto;
  box-shadow: 0 4px 12px rgba(15,110,86,.35);
}
.wf-logo-mark::before {
  content: ""; position: absolute; inset: 9px 10px;
  border-radius: 3px;
  background: rgba(255,255,255,.92);
}
.wf-logo-mark::after {
  content: ""; position: absolute; left: 13px; top: 13px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--wf-teal-deep);
}
.wf-logo-word {
  font-family: 'Inter', sans-serif; font-weight: 800;
  font-size: 19px; letter-spacing: -0.02em; color: var(--wf-ink);
}
.wf-logo-word .ai { color: var(--wf-teal); }

/* ============================================================
   Page toolbar (title + theme toggle), lives outside canvas world
   ============================================================ */
.pa-toolbar {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  z-index: 90;
  display: flex; align-items: center; gap: 14px;
  padding: 9px 10px 9px 16px;
  background: rgba(255,255,255,.82);
  backdrop-filter: blur(14px) saturate(1.4);
  border: 1px solid rgba(11,22,40,.08);
  border-radius: var(--wf-pill);
  box-shadow: 0 8px 30px rgba(11,22,40,.12);
  font-family: 'Inter', sans-serif;
}
:root[data-theme="dark"] .pa-toolbar {
  background: rgba(13,26,46,.8);
  border-color: rgba(255,255,255,.1);
  box-shadow: 0 8px 30px rgba(0,0,0,.5);
}
.pa-toolbar .pa-title {
  font-size: 13px; font-weight: 700; color: var(--wf-ink);
  letter-spacing: -0.01em; white-space: nowrap;
}
.pa-toolbar .pa-meta {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; color: var(--wf-ink-2);
  padding-left: 14px; border-left: 1px solid var(--wf-line);
  white-space: nowrap;
}
.pa-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 4px 0 12px;
  border-radius: var(--wf-pill);
  background: var(--wf-page-2);
  border: 1px solid var(--wf-line);
  cursor: pointer;
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  color: var(--wf-ink-2);
}
.pa-toggle .sw {
  width: 38px; height: 22px; border-radius: var(--wf-pill);
  background: var(--wf-box-2); position: relative; transition: background .2s;
}
.pa-toggle .sw::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3);
  transition: transform .2s;
}
:root[data-theme="dark"] .pa-toggle .sw { background: var(--wf-teal-deep); }
:root[data-theme="dark"] .pa-toggle .sw::after { transform: translateX(16px); }

@media (max-width: 720px) {
  .pa-toolbar .pa-meta { display: none; }
}

/* ---- dark-mode overrides for the canvas chrome ---- */
:root[data-theme="dark"] .design-canvas { background: #070d18 !important; }
:root[data-theme="dark"] .dc-sectionhead .dc-editable { color: #E9EEF4 !important; }
:root[data-theme="dark"] .dc-sectionhead div { color: #8597AC !important; }
:root[data-theme="dark"] .dc-header,
:root[data-theme="dark"] .dc-header * { color: #91A2B6 !important; }
</style>

  html, body { margin: 0; padding: 0; }

<body>

<div id="root"></div>

<!-- page toolbar: title + theme toggle (outside the canvas world) -->
<div class="pa-toolbar">
  <span class="pa-title">PrintAI — Wireframe Exploration</span>
  <span class="pa-meta">mid-fi · desktop-first · 10 sections</span>
  <button class="pa-toggle" id="themeToggle" aria-label="Toggle dark theme">
    <span id="themeLabel">Light</span>
    <span class="sw"></span>
  </button>
</div>

<script>
  (function () {
    var btn = document.getElementById('themeToggle');
    var label = document.getElementById('themeLabel');
    function sync() {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      label.textContent = dark ? 'Dark' : 'Light';
    }
    sync();
    btn.addEventListener('click', function () {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      var next = dark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('printai-wf-theme', next); } catch (e) {}
      sync();
    });
  })();
</script>
